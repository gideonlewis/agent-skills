# agents/openai.yaml — cấu hình interface cho OpenAI/Codex agent runtime.
# YAML dùng ký tự "#" để comment (không phải "//"). Các thuộc tính đang được
# comment là tuỳ chọn: bỏ dấu "#" ở đầu dòng khi cần bật.

interface:
  display_name: "Feature Flag Cleanup — azuki-app"       # Tên hiển thị trên UI
  short_description: "Gỡ feature flag đã rollout xong khỏi frontend azuki-app (Phase 1 của xoá 2 pha)"    # Mô tả ngắn, một dòng
  default_prompt: "Dùng $spcc-app-feature-flag-cleanup để gỡ toàn bộ tham chiếu của một feature flag khỏi azuki-app."      # Prompt gợi ý khi người dùng chọn skill
  # icon_small: "./assets/spcc-app-feature-flag-cleanup-small.svg"   # Icon nhỏ, đường dẫn tương đối tới thư mục skill
  # icon_large: "./assets/spcc-app-feature-flag-cleanup.png"         # Icon lớn
  # brand_color: "#0F62FE"        # Màu thương hiệu, dạng hex

policy:
  allow_implicit_invocation: false  # true = cho phép agent tự kích hoạt khi thấy phù hợp
  # products:                       # Giới hạn runtime được phép dùng skill
