# agents/openai.yaml — cấu hình interface cho OpenAI/Codex agent runtime.
# YAML dùng ký tự "#" để comment (không phải "//"). Các thuộc tính đang được
# comment là tuỳ chọn: bỏ dấu "#" ở đầu dòng khi cần bật.

interface:
  display_name: "Migrate Console RPC → Core Proto"       # Tên hiển thị trên UI
  short_description: "Phân tích Console RPC, viết proto Core theo mẫu chunk_1, xuất migration report"    # Mô tả ngắn, một dòng
  default_prompt: "Dùng $spcc-migrate-console-rpc-to-core-proto để phân tích 3-5 Console RPC, viết proto Core và xuất migration report."      # Prompt gợi ý khi người dùng chọn skill
  # icon_small: "./assets/spcc-migrate-console-rpc-to-core-proto-small.svg"   # Icon nhỏ, đường dẫn tương đối tới thư mục skill
  # icon_large: "./assets/spcc-migrate-console-rpc-to-core-proto.png"         # Icon lớn
  # brand_color: "#0F62FE"        # Màu thương hiệu, dạng hex

policy:
  allow_implicit_invocation: false  # true = cho phép agent tự kích hoạt khi thấy phù hợp
