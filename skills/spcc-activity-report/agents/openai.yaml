# agents/openai.yaml — cấu hình interface cho OpenAI/Codex agent runtime.
# YAML dùng ký tự "#" để comment (không phải "//"). Các thuộc tính đang được
# comment là tuỳ chọn: bỏ dấu "#" ở đầu dòng khi cần bật.

interface:
  display_name: "SPC-Collab Activity Report"       # Tên hiển thị trên UI
  short_description: "Report hoạt động Mattermost + Backlog theo ticket (05:00 → lúc gọi), gom task con vào ticket cha"    # Mô tả ngắn, một dòng
  default_prompt: "Dùng $spcc-activity-report để report hoạt động của team từ 05:00 sáng nay tới giờ theo từng ticket."      # Prompt gợi ý khi người dùng chọn skill
  # icon_small: "./assets/spcc-activity-report-small.svg"   # Icon nhỏ, đường dẫn tương đối tới thư mục skill
  # icon_large: "./assets/spcc-activity-report.png"         # Icon lớn
  # brand_color: "#0F62FE"        # Màu thương hiệu, dạng hex

policy:
  allow_implicit_invocation: false  # true = cho phép agent tự kích hoạt khi thấy phù hợp
  # products:                       # Giới hạn runtime được phép dùng skill
  #   - CODEX

dependencies:          # Khai báo công cụ mà skill phụ thuộc
  tools:
    - type: "mcp"
      value: "ai-platform"
      description: "mattermost-* (read_channel, read_post, search_posts, search_users), teq_backlog-* (get_user_recent_updates, get_issues, get_issue, get_project_user_list)"
    - type: "cli"
      value: "python3"
      description: "references/collect.py: khung giờ, thành viên, lọc và gom ticket"
