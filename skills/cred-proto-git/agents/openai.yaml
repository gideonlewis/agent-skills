# agents/openai.yaml — cấu hình interface cho OpenAI/Codex agent runtime.
# YAML dùng ký tự "#" để comment (không phải "//"). Các thuộc tính đang được
# comment là tuỳ chọn: bỏ dấu "#" ở đầu dòng khi cần bật.

interface:
  display_name: "cred-proto Git"       # Tên hiển thị trên UI
  short_description: "Tạo branch (mới / follow-up stacked trên PR), commit, push an toàn trong cred-proto"    # Mô tả ngắn, một dòng
  default_prompt: "Dùng $cred-proto-git để tạo branch làm việc hoặc commit/push thay đổi proto trong cred-proto."      # Prompt gợi ý khi người dùng chọn skill
  # icon_small: "./assets/cred-proto-git-small.svg"   # Icon nhỏ, đường dẫn tương đối tới thư mục skill
  # icon_large: "./assets/cred-proto-git.png"         # Icon lớn
  # brand_color: "#0F62FE"        # Màu thương hiệu, dạng hex

policy:
  allow_implicit_invocation: false  # true = cho phép agent tự kích hoạt khi thấy phù hợp
  # products:                       # Giới hạn runtime được phép dùng skill
  #   - CODEX

dependencies:          # Khai báo công cụ mà skill phụ thuộc
  tools:
    - type: "cli"
      value: "git"
      description: "Tạo branch, commit, push"
    - type: "cli"
      value: "gh"
      description: "Đọc head/base branch của PR gốc ở chế độ followup"
