# agents/openai.yaml — cấu hình interface cho OpenAI/Codex agent runtime.
# YAML dùng ký tự "#" để comment (không phải "//"). Các thuộc tính đang được
# comment là tuỳ chọn: bỏ dấu "#" ở đầu dòng khi cần bật.

interface:
  display_name: "HTML Diagram"       # Tên hiển thị trên UI
  short_description: "Trực quan hóa kiến trúc bằng sơ đồ SVG"    # Mô tả ngắn, một dòng
  default_prompt: "Dùng $html-diagram để tạo một sơ đồ SVG full-screen giúp hiểu nhanh kiến trúc hệ thống."      # Prompt gợi ý khi người dùng chọn skill
  # icon_small: "./assets/html-diagram-small.svg"   # Icon nhỏ, đường dẫn tương đối tới thư mục skill
  # icon_large: "./assets/html-diagram.png"         # Icon lớn
  # brand_color: "#0F62FE"        # Màu thương hiệu, dạng hex

policy:
  allow_implicit_invocation: false  # true = cho phép agent tự kích hoạt khi thấy phù hợp
  # products:                       # Giới hạn runtime được phép dùng skill
