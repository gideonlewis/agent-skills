# agents/openai.yaml — cấu hình interface cho OpenAI/Codex agent runtime.
# YAML dùng ký tự "#" để comment (không phải "//"). Các thuộc tính đang được
# comment là tuỳ chọn: bỏ dấu "#" ở đầu dòng khi cần bật.

interface:
  display_name: "Core API Backlog Task"       # Tên hiển thị trên UI
  short_description: "Rã chunk Core API migration thành BE Task Backlog và viết description (Solution, RPC info, Expected, Evidence)"    # Mô tả ngắn, một dòng
  default_prompt: "Dùng $azuki-core-api-backlog-task để rã task BE cho chunk_N và viết description trên Backlog."      # Prompt gợi ý khi người dùng chọn skill
  # icon_small: "./assets/azuki-core-api-backlog-task-small.svg"   # Icon nhỏ, đường dẫn tương đối tới thư mục skill
  # icon_large: "./assets/azuki-core-api-backlog-task.png"         # Icon lớn
  # brand_color: "#0F62FE"        # Màu thương hiệu, dạng hex

policy:
  allow_implicit_invocation: false  # true = cho phép agent tự kích hoạt khi thấy phù hợp
  # products:                       # Giới hạn runtime được phép dùng skill
  #   - CODEX

dependencies:          # Khai báo công cụ mà skill phụ thuộc
  tools:
    - type: "mcp"
      value: "teq_backlog"
      description: "Đọc ticket chunk, khử trùng RPC, tạo/cập nhật BE Task"
    - type: "mcp"
      value: "google_sheets"
      description: "Đọc tab MigPages và CoreAPIs của sheet CoreAPI"
