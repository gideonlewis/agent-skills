# agents/openai.yaml — cấu hình interface cho OpenAI/Codex agent runtime.
# YAML dùng ký tự "#" để comment (không phải "//"). Các thuộc tính đang được
# comment là tuỳ chọn: bỏ dấu "#" ở đầu dòng khi cần bật.

interface:
  display_name: "SPC-Collab Daily Sheet"       # Tên hiển thị trên UI
  short_description: "Cập nhật dòng ticket trên sheet SPC Collab Sprint daily reports từ một Mattermost thread hoặc từ activity report"    # Mô tả ngắn, một dòng
  default_prompt: "Dùng $spcc-daily-sheet-sync để tóm tắt thread này và cập nhật daily report."      # Prompt gợi ý khi người dùng chọn skill
  # icon_small: "./assets/spcc-daily-sheet-sync-small.svg"   # Icon nhỏ, đường dẫn tương đối tới thư mục skill
  # icon_large: "./assets/spcc-daily-sheet-sync.png"         # Icon lớn
  # brand_color: "#0F62FE"        # Màu thương hiệu, dạng hex

policy:
  allow_implicit_invocation: false  # true = cho phép agent tự kích hoạt khi thấy phù hợp
  # products:                       # Giới hạn runtime được phép dùng skill
  #   - CODEX

dependencies:          # Khai báo công cụ mà skill phụ thuộc
  tools:
    - type: "mcp"
      value: "ai-platform"
      description: "mattermost-* (read_post, create_post) và google_sheets-* (get_values, update_values, get_spreadsheet)"
