# agents/openai.yaml — cấu hình interface cho OpenAI/Codex agent runtime.
# YAML dùng ký tự "#" để comment (không phải "//"). Các thuộc tính đang được
# comment là tuỳ chọn: bỏ dấu "#" ở đầu dòng khi cần bật.

interface:
  display_name: "SPC Collab Calendar"       # Tên hiển thị trên UI
  short_description: "Đặt lịch họp cho dự án spc-collab theo nhóm DEV/PO/BrSE/QC"    # Mô tả ngắn, một dòng
  default_prompt: "Dùng $spcc-calendar để đặt lịch họp spc-collab: expand nhóm người, thêm prefix module vào tiêu đề, rồi giao cho google-calendar tạo event."      # Prompt gợi ý khi người dùng chọn skill
  # icon_small: "./assets/spcc-calendar-small.svg"   # Icon nhỏ, đường dẫn tương đối tới thư mục skill
  # icon_large: "./assets/spcc-calendar.png"         # Icon lớn
  # brand_color: "#0F62FE"        # Màu thương hiệu, dạng hex

policy:
  allow_implicit_invocation: false  # true = cho phép agent tự kích hoạt khi thấy phù hợp
