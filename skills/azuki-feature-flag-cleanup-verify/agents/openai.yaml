# agents/openai.yaml — cấu hình interface cho OpenAI/Codex agent runtime.
# YAML dùng ký tự "#" để comment (không phải "//"). Các thuộc tính đang được
# comment là tuỳ chọn: bỏ dấu "#" ở đầu dòng khi cần bật.

interface:
  display_name: "Verify Feature Flag Cleanup"       # Tên hiển thị trên UI
  short_description: "Double-check việc xoá feature flag ở azuki/azuki-app trước khi mở PR hoặc khi review PR"    # Mô tả ngắn, một dòng
  default_prompt: "Dùng $azuki-feature-flag-cleanup-verify để kiểm tra lại việc cleanup feature flag: sót tham chiếu, giữ đúng nhánh enabled, dead code, build/test."      # Prompt gợi ý khi người dùng chọn skill
  # icon_small: "./assets/azuki-feature-flag-cleanup-verify-small.svg"   # Icon nhỏ, đường dẫn tương đối tới thư mục skill
  # icon_large: "./assets/azuki-feature-flag-cleanup-verify.png"         # Icon lớn
  # brand_color: "#0F62FE"        # Màu thương hiệu, dạng hex

policy:
  allow_implicit_invocation: false  # true = cho phép agent tự kích hoạt khi thấy phù hợp
  # products:                       # Giới hạn runtime được phép dùng skill
  #   - CODEX

# dependencies:          # Khai báo công cụ mà skill phụ thuộc
#   tools:
#     - type: "cli"      # "cli" cho lệnh shell, "mcp" cho MCP server
#       value: "gh"      # Tên lệnh hoặc tên MCP server
#       description: "Đọc trạng thái CI và thông tin PR khi review PR người khác"
