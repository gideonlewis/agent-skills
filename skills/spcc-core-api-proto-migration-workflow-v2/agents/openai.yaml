# agents/openai.yaml — cấu hình interface cho OpenAI/Codex agent runtime.
# YAML dùng ký tự "#" để comment (không phải "//"). Các thuộc tính đang được
# comment là tuỳ chọn: bỏ dấu "#" ở đầu dòng khi cần bật.

interface:
  display_name: "Console RPC → Core Proto Migration (v2)"       # Tên hiển thị trên UI
  short_description: "Migrate 1 Console RPC sang Core proto với core.entity riêng, giữ type Console, 1 RPC 1 PR, đăng ký core_service theo lô"    # Mô tả ngắn, một dòng
  default_prompt: "Dùng $spcc-core-api-proto-migration-workflow-v2 để migrate Console RPC sang Core proto trong cred-proto và mở PR."      # Prompt gợi ý khi người dùng chọn skill
  # icon_small: "./assets/spcc-core-api-proto-migration-workflow-v2-small.svg"   # Icon nhỏ
  # icon_large: "./assets/spcc-core-api-proto-migration-workflow-v2.png"         # Icon lớn
  # brand_color: "#0F62FE"        # Màu thương hiệu, dạng hex

policy:
  allow_implicit_invocation: false  # true = cho phép agent tự kích hoạt khi thấy phù hợp
  # products:                       # Giới hạn runtime được phép dùng skill
  #   - CODEX

dependencies:          # Khai báo công cụ mà skill phụ thuộc
  tools:
    - type: "cli"
      value: "gh"
      description: "Đọc PR/review comment, tạo PR, gắn label, đổi base khi stack"
    - type: "cli"
      value: "git"
      description: "Tạo branch, stack, rebase, commit, push --force-with-lease"
    - type: "cli"
      value: "make"
      description: "make lint / format/check / gen qua image builder (cần Docker)"
    - type: "cli"
      value: "grep"
      description: "So field với Console, kiểm chứng validate bằng code azuki/azuki-app"
